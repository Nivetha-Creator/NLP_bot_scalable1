[project]
name = "nlp-bot-scalable"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "nltk>=3.10.3",
    "numpy>=2.5.2",
    "pydantic-settings>=2.15.0",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.52",
    "tensorflow>=2.21.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
nlp-bot-scalable = "nlp_bot_scalable:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
